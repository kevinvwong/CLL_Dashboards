{# Edit-tags FRAGMENT (loaded into #card-modal by hx-get). Does not extend
   base.html; a direct GET renders edit_tags_full.html. #}
<div class="card-body">
  <h2>Tags for {{ card.Code }}</h2>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form hx-post="/team-initiatives/{{ card.Code }}/edit/tags" hx-target="#card-modal" hx-swap="innerHTML" class="card">
    <fieldset>
      <legend>Goals</legend>
      {% for g in goals %}
      <label class="check">
        <input type="checkbox" name="goal" value="{{ g.GoalID }}"
               {% if g.GoalID in chosen_goals %}checked{% endif %}>
        <span>Goal {{ g.GoalNumber }}: {{ g.FullName or g.ShortName }}</span>
        <label class="primary">
          <input type="radio" name="goal_primary" value="{{ g.GoalID }}"> primary
        </label>
      </label>
      {% endfor %}
    </fieldset>
    <fieldset>
      <legend>Priorities</legend>
      {% for p in priorities %}
      <label class="check">
        <input type="checkbox" name="priority" value="{{ p.PriorityID }}"
               {% if p.PriorityID in chosen_priorities %}checked{% endif %}>
        <span>{{ p.PriorityName | priority_label }} ({{ p.PlanYear }})</span>
        <label class="primary">
          <input type="radio" name="priority_primary" value="{{ p.PriorityID }}"> primary
        </label>
      </label>
      {% endfor %}
    </fieldset>
    <button type="submit">Save tags</button>
  </form>
</div>
