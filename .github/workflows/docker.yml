name: Docker Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify DB build script
        run: |
          python ospec/db/build_db.py

      - name: Build Docker image
        run: |
          docker build -t cll-dashboard-prototype .

      - name: Run container and check health
        run: |
          docker run -d -p 8000:8000 --name test-dashboard cll-dashboard-prototype
          # Wait for the server to start
          sleep 5
          # Verify the placeholder page returns HTTP 200
          curl -f http://localhost:8000 || exit 1
          docker stop test-dashboard
          docker rm test-dashboard
